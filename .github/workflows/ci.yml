name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

# Every cargo invocation below passes --locked (except `cargo fmt`, which does
# not resolve dependencies and rejects the flag). Without it cargo silently
# rewrites Cargo.lock when resolution would change, which is exactly how the
# 2026-08-20 arrayref/proc-macro1 attack propagated: the attacker yanked the
# good versions to force resolution onto a malicious one. --locked turns that
# into a failed build instead of a silent upgrade.

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Enforce formatting
        run: cargo fmt --check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build release binary
        run: cargo build --release --locked

  lib-only:
    name: Build (library only)
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      # The `cli` feature is what keeps `vault` the library separable from
      # `vault` the command-line tool. Nothing else in CI builds without it, so
      # without this job an accidental dependency on a CLI module would only
      # surface for a downstream consumer.
      - name: Build without the CLI feature
        run: cargo build --no-default-features --lib --locked

      - name: Lint without the CLI feature
        run: cargo clippy --no-default-features --lib --locked -- -D warnings

      # Design rule 3, checked on the artifact a consumer links rather than on
      # the source. A source grep cannot do this: the library's stdin reads sit
      # inside `#[cfg(feature = "cli")]` arms, so the text is present in a build
      # that does not contain the code.
      - name: Assert the library touches no stdin/stdout
        run: ./scripts/check-library-io.sh

  audit-script:
    name: Supply-chain audit script
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The audit walks every object in the store, including unreachable
          # ones, so a shallow clone would hand it an empty denominator and a
          # confident "clean".
          fetch-depth: 0

      # Tests the detector, not this repo: it builds throwaway git repos and
      # checks that a listed crate is found in each place it can hide, and that
      # documentation naming the incident is not. The script used to flag its
      # own repo's docs and always exit 1, which is how a detector gets ignored.
      - name: Verify the audit script still detects
        run: ./scripts/test-supply-chain-audit.sh

      - name: Audit this repository
        run: ./scripts/supply-chain-audit.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Linting
        run: cargo clippy --locked -- -D warnings
