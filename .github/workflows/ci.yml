name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Enforce formatting
        run: cargo fmt --check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run tests
        run: cargo test

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build release binary
        run: cargo build --release --locked

  lib-only:
    name: Build (library only)
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      # The `cli` feature is what keeps `vault` the library separable from
      # `vault` the command-line tool. Nothing else in CI builds without it, so
      # without this job an accidental dependency on a CLI module would only
      # surface for a downstream consumer.
      - name: Build without the CLI feature
        run: cargo build --no-default-features --lib

      - name: Lint without the CLI feature
        run: cargo clippy --no-default-features --lib -- -D warnings

      # Design rule 3, checked on the artifact a consumer links rather than on
      # the source. A source grep cannot do this: the library's stdin reads sit
      # inside `#[cfg(feature = "cli")]` arms, so the text is present in a build
      # that does not contain the code.
      - name: Assert the library touches no stdin/stdout
        run: ./scripts/check-library-io.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Linting
        run: cargo clippy -- -D warnings
