name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]
  # An advisory can land against an unchanged lockfile, so the audit job needs a
  # trigger that does not depend on someone opening a PR. Every job runs on this
  # schedule, which also catches toolchain rot for free.
  schedule:
    - cron: "0 7 * * 1"

env:
  CARGO_TERM_COLOR: always

# Every cargo invocation below passes --locked (except `cargo fmt`, which does
# not resolve dependencies and rejects the flag). Without it cargo silently
# rewrites Cargo.lock when resolution would change, which is exactly how the
# 2026-08-20 arrayref/proc-macro1 attack propagated: the attacker yanked the
# good versions to force resolution onto a malicious one. --locked turns that
# into a failed build instead of a silent upgrade.

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Enforce formatting
        run: cargo fmt --check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build release binary
        run: cargo build --release --locked

  lib-only:
    name: Build (library only)
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      # The `cli` feature is what keeps `vault` the library separable from
      # `vault` the command-line tool. Nothing else in CI builds without it, so
      # without this job an accidental dependency on a CLI module would only
      # surface for a downstream consumer.
      - name: Build without the CLI feature
        run: cargo build --no-default-features --lib --locked

      - name: Lint without the CLI feature
        run: cargo clippy --no-default-features --lib --locked -- -D warnings

      # Design rule 3, checked on the artifact a consumer links rather than on
      # the source. A source grep cannot do this: the library's stdin reads sit
      # inside `#[cfg(feature = "cli")]` arms, so the text is present in a build
      # that does not contain the code.
      - name: Assert the library touches no stdin/stdout
        run: ./scripts/check-library-io.sh

  audit:
    name: Advisory audit
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # Built from source rather than pulled from a third-party action. The whole
      # point of this job is supply-chain hygiene, and `cargo install --locked`
      # resolves against cargo-audit's own committed lockfile — one less
      # unpinned dependency in the pipeline that is supposed to catch those.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Reads the RustSec advisory database, which is maintained — the durable
      # complement to `--locked`. `--locked` stops resolution being silently
      # rewritten; this catches a crate that was fine when we pinned it and is
      # not fine now. Expect this to go red without any code change: that is the
      # job working, not a flake.
      - name: Audit the dependency graph
        run: cargo audit

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Linting
        run: cargo clippy --locked -- -D warnings
